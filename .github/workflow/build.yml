name: LegacyOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            grub-pc-bin \
            grub-common \
            xorriso \
            make

      - name: Build LegacyOS
        run: make

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: LegacyOS-ISO
          path: build/LegacyOS.iso
